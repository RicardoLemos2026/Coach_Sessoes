<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle de Sessões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra superior fixa + área de trabalho em cartões por função (lançar, conferir, fechar) */
:root {
  --bg: #f3f5f3;
  --surface: #ffffff;
  --surface-2: #f8faf9;
  --ink: #15201e;
  --muted: #5b6a66;
  --line: #dbe2df;
  --accent: #0e6b5b;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1ed;
  --pend: #9a6400; --pend-bg: #fdf1dc;
  --ok: #17753f; --ok-bg: #e0f3e7;
  --bad: #b3261e; --bad-bg: #fbe4e2;
  --lock: #3f4f63; --lock-bg: #e6ebf2;
  --shadow: 0 1px 2px rgba(21,32,30,.06), 0 4px 16px rgba(21,32,30,.05);
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1514; --surface: #172020; --surface-2: #1c2726; --ink: #e5ecea; --muted: #97a7a3; --line: #2a3735;
  --accent: #4fc2a9; --accent-ink: #062520; --accent-soft: #173a33;
  --pend: #f0b54f; --pend-bg: #3a2c12; --ok: #6fd49a; --ok-bg: #173424; --bad: #ff8a80; --bad-bg: #3d1a18;
  --lock: #b3c3d8; --lock-bg: #243040; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #172020; --surface-2: #1c2726; --ink: #e5ecea; --muted: #97a7a3; --line: #2a3735;
  --accent: #4fc2a9; --accent-ink: #062520; --accent-soft: #173a33;
  --pend: #f0b54f; --pend-bg: #3a2c12; --ok: #6fd49a; --ok-bg: #173424; --bad: #ff8a80; --bad-bg: #3d1a18;
  --lock: #b3c3d8; --lock-bg: #243040; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- topo ---------- */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topo-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
.marca .selo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .8rem; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; min-width: 0; }
.nav button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: .92rem; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.quem { display: flex; align-items: center; gap: 10px; font-size: .88rem; color: var(--muted); }
.quem b { color: var(--ink); font-weight: 600; }
.demo-faixa { background: var(--pend-bg); color: var(--pend); text-align: center; font-size: .85rem; padding: 6px 16px; font-weight: 600; }

main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; display: grid; gap: 18px; }
.cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cab p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }

.mes { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.mes button { border: 0; background: none; width: 34px; height: 34px; cursor: pointer; border-radius: 999px; font-size: 1.1rem; color: var(--muted); }
.mes button:hover { background: var(--surface-2); color: var(--ink); }
.mes span { min-width: 136px; text-align: center; font-weight: 600; }

/* ---------- blocos ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card > h2, .card > .cab { margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.kpi small { display: block; color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.kpi strong { display: block; font-family: var(--f-display); font-size: 1.5rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi.alerta strong { color: var(--pend); }

/* ---------- formulários ---------- */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
.campo { display: grid; gap: 4px; min-width: 0; }
.campo label { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.campo input, .campo select, .campo textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-height: 40px; }
.campo textarea { min-height: 80px; resize: vertical; }
.campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.campo.largo { grid-column: 1 / -1; }
.dica { font-size: .82rem; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .92rem; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ok { color: var(--ok); } .btn.bad { color: var(--bad); }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: .84rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ico { border: 0; background: none; cursor: pointer; padding: 5px 7px; border-radius: 6px; color: var(--muted); font-weight: 600; font-size: .84rem; }
.ico:hover { background: var(--surface-2); color: var(--ink); }
.ico.ok:hover { color: var(--ok); } .ico.bad:hover { color: var(--bad); }

/* ---------- tabelas ---------- */
.tabwrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: var(--surface-2); }
tr.coment td { padding-top: 0; border-bottom: 1px solid var(--line); }
tr.linha-rec td { border-bottom: 0; }
tfoot td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: 0; }
.vazio { padding: 26px; text-align: center; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .76rem; font-weight: 700; white-space: nowrap; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-pendente { color: var(--pend); background: var(--pend-bg); }
.p-aprovada { color: var(--ok); background: var(--ok-bg); }
.p-recusada { color: var(--bad); background: var(--bad-bg); }
.p-fechado { color: var(--lock); background: var(--lock-bg); }
.p-aberto { color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); }
.tipo { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: .74rem; font-weight: 800; background: var(--surface-2); border: 1px solid var(--line); }
.tipo.B { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tipo.q { border-style: dashed; color: var(--pend); }
.nota { font-size: .84rem; color: var(--muted); }
.coment-box { font-size: .86rem; padding: 7px 10px; border-radius: 8px; background: var(--bad-bg); color: var(--bad); }

.aviso { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 8px; font-size: .9rem; }
.aviso.fechado { background: var(--lock-bg); color: var(--lock); }
.aviso.atencao { background: var(--pend-bg); color: var(--pend); }
.aviso.erro { background: var(--bad-bg); color: var(--bad); }
.aviso ul { margin: 4px 0 0; padding-left: 18px; }

.resumo td { padding: 7px 0; }
.resumo td + td { padding-left: 10px; }
.total-grande { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--ink); padding-top: 10px; margin-top: 6px; }
.total-grande strong { font-family: var(--f-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.sub-total { display: flex; justify-content: space-between; color: var(--muted); font-size: .88rem; padding: 3px 0; }

/* ---------- login ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.login .card { width: 100%; max-width: 400px; padding: 28px; box-shadow: var(--shadow); display: grid; gap: 16px; }
.login h1 { font-size: 1.6rem; }
.login p { margin: 0; color: var(--muted); }
.demo-contas { display: grid; gap: 6px; }
.demo-contas button { text-align: left; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; font-size: .9rem; }

/* ---------- modal e toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(10,16,15,.45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; padding: 22px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal p { margin: 0; color: var(--muted); }
.toasts { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 60; width: min(92vw, 420px); }
.toast { background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 10px; font-size: .9rem; box-shadow: var(--shadow); }
.toast.erro { background: var(--bad); color: #fff; }
.carregando { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: sobe .2s ease-out; } @keyframes sobe { from { transform: translateY(8px); opacity: 0; } } }
@media (max-width: 760px) {
  .nav { order: 3; flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
  .nav button { white-space: nowrap; }
  .marca { flex: 1; }
}
@media (max-width: 640px) { .quem .email { display: none; } .mes span { min-width: 112px; } }
.cred { display: grid; gap: 6px; padding: 12px 14px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; user-select: all; }
</style>
</head>
<body>
<div id="app"><div class="carregando">Carregando…</div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
